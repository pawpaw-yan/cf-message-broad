name = "message-broad"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# KV 绑定：Git 部署与命令行部署（npm run deploy）均使用此配置
# 如更换 namespace，请同步更新此处 id 与控制台中的绑定
[[kv_namespaces]]
binding = "MESSAGES_KV"
id = "5f016eeeec144264a9cc89ca91b24789"

# 可选环境变量（在 Pages 控制台 Settings → Environment variables 中设置）：
#   WEBHOOK_SECRET - 设置后发送留言需携带密钥（?secret=xxx 或 X-Webhook-Secret 头）
#   ADMIN_SECRET   - 删除留言的管理密钥（未设置时回退用 WEBHOOK_SECRET）
