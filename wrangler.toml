name = "message-broad"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# KV 绑定：部署前先创建 namespace 并把 id 换成你自己的
#   npx wrangler kv namespace create MESSAGES_KV
# 通过 Git 连接部署时，请在 Pages 控制台 Settings → Functions → KV namespace bindings 中绑定 MESSAGES_KV
[[kv_namespaces]]
binding = "MESSAGES_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# 可选环境变量（在 Pages 控制台 Settings → Environment variables 中设置）：
#   WEBHOOK_SECRET - 设置后发送留言需携带密钥（?secret=xxx 或 X-Webhook-Secret 头）
#   ADMIN_SECRET   - 删除留言的管理密钥（未设置时回退用 WEBHOOK_SECRET）
